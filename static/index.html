<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Epigen — a personal memory layer for AI</title>
<style>
  :root { --bg: #0e1116; --card: #171c24; --ink: #e8ecf1; --dim: #9aa4b2;
          --accent: #7cc4ff; --good: #8fe3a8; --line: #2a3340; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink);
         font: 16px/1.5 -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
  header { padding: 20px 28px 0; max-width: 1280px; margin: 0 auto; }
  header h1 { margin: 0 0 4px; font-size: 28px; }
  header h1 span { color: var(--accent); }
  header p { margin: 0 0 12px; color: var(--dim); }
  #mode { display: inline-block; font-size: 13px; padding: 2px 10px;
          border: 1px solid var(--line); border-radius: 999px; color: var(--dim); }
  main { max-width: 1280px; margin: 0 auto; padding: 16px 28px 40px; }
  #askbar { display: flex; gap: 12px; align-items: center; flex-wrap: wrap;
            background: var(--card); border: 1px solid var(--line);
            border-radius: 12px; padding: 14px; }
  #askbar input[type=text] { flex: 1; min-width: 220px; padding: 10px 12px;
            border-radius: 8px; border: 1px solid var(--line);
            background: #0c0f14; color: var(--ink); font-size: 16px; }
  #askbar button { padding: 10px 18px; font-size: 16px; border-radius: 8px;
            border: 0; background: var(--accent); color: #06121f; cursor: pointer; }
  #askbar button:disabled { opacity: .5; cursor: wait; }
  #preview { max-height: 64px; border-radius: 8px; display: none; }
  .cols { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-top: 16px; }
  @media (max-width: 800px) { .cols { grid-template-columns: 1fr; } }
  .card { background: var(--card); border: 1px solid var(--line);
          border-radius: 12px; padding: 16px 18px; }
  .card h2 { margin: 0 0 8px; font-size: 18px; }
  .card h2 .tag { font-size: 12px; color: var(--dim); font-weight: normal; }
  .answer { white-space: pre-wrap; min-height: 120px; }
  #cited { list-style: none; margin: 12px 0 0; padding: 0; }
  #cited li { border-top: 1px solid var(--line); padding: 8px 0; font-size: 14px; }
  #cited .meta { color: var(--good); font-family: ui-monospace, monospace; font-size: 13px; }
  #outcome { margin-top: 16px; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  #outcome button { padding: 8px 16px; border-radius: 8px; cursor: pointer;
            border: 1px solid var(--line); background: #0c0f14; color: var(--ink); }
  #outcome button:hover { border-color: var(--accent); }
  #photoDesc { color: var(--dim); font-size: 14px; margin-top: 12px; }
</style>
</head>
<body>
<header>
  <h1>Epigen <span>· a personal memory layer for AI</span></h1>
  <p>Same question, two answers. Plain Muse knows nothing about you; Epigen answers from your memories.</p>
  <span id="mode">…</span>
</header>
<main>
  <div id="askbar">
    <input type="file" id="photo" accept="image/*" aria-label="Upload a photo">
    <img id="preview" alt="photo preview">
    <input type="text" id="question" value="Should I buy this?" aria-label="Your question">
    <button id="ask" onclick="ask()">Ask both</button>
  </div>
  <div id="photoDesc"></div>
  <div class="cols">
    <div class="card"><h2>Plain Muse <span class="tag">no personal context</span></h2>
      <div class="answer" id="plain">—</div></div>
    <div class="card"><h2>Epigen <span class="tag">memory-grounded</span></h2>
      <div class="answer" id="epigen">—</div>
      <h3 style="font-size:15px;margin:14px 0 0">Cited memories</h3>
      <ul id="cited"><li>—</li></ul></div>
  </div>
  <div id="outcome">
    <span>Log outcome:</span>
    <button onclick="logOutcome('kept')">Kept</button>
    <button onclick="logOutcome('returned')">Returned</button>
    <button onclick="logOutcome('regretted')">Regretted</button>
    <span id="olog" style="color:var(--dim)"></span>
  </div>
</main>
<script>
const $ = id => document.getElementById(id);
fetch('/api/health').then(r => r.json()).then(h => {
  $('mode').textContent = h.demo_mode ? 'DEMO MODE (no MODEL_API_KEY)' : 'LIVE (Meta Model API)';
});
$('photo').addEventListener('change', e => {
  const f = e.target.files[0];
  if (!f) return;
  $('preview').src = URL.createObjectURL(f);
  $('preview').style.display = 'block';
});
async function ask() {
  const btn = $('ask'); btn.disabled = true;
  $('plain').textContent = '…'; $('epigen').textContent = '…';
  const fd = new FormData();
  fd.append('question', $('question').value);
  const f = $('photo').files[0];
  if (f) fd.append('photo', f);
  try {
    const r = await fetch('/api/ask', {method: 'POST', body: fd});
    const j = await r.json();
    $('plain').textContent = j.plain;
    $('epigen').textContent = j.epigen;
    $('photoDesc').textContent = j.photo_description ? 'Photo: ' + j.photo_description : '';
    $('cited').innerHTML = j.cited.map(c =>
      `<li><span class="meta">${c.id} · ${c.angle} · score ${c.score}</span><br>${c.text}</li>`
    ).join('') || '<li>—</li>';
  } catch (e) { $('epigen').textContent = 'Error: ' + e; }
  btn.disabled = false;
}
async function logOutcome(outcome) {
  const r = await fetch('/api/outcome', {method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({outcome, item: 'the $180 jacket', price: 180})});
  const j = await r.json();
  $('olog').textContent = r.ok ? 'Saved ' + j.memory.id + ' — ask again to see the change.' : 'Error: ' + j.error;
}
</script>
</body>
</html>
